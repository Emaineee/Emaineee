services:
  - type: web
    name: guidetrack-api
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma migrate deploy && npm run build
    startCommand: node dist/server.js && npx ts-node prisma/seed.ts
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: guidetrack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: guidetrack-db
    plan: free
    databaseName: guidetrack
