services:
  - type: web
    name: guidetrack-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npx prisma migrate reset --force && npm run build && node prisma/seed.js
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: guidetrack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: guidetrack-db
    plan: free
    databaseName: guidetrack